name: Audit and Fix Questions

on:
  workflow_dispatch:
    inputs:
      category:
        description: 'Choose category to audit'
        required: true
        default: 'geografija'
        type: choice
        options:
          - 'geografija'
          - 'glazba'
          - 'knjizevnost_i_umjetnost'
          - 'opca_znanje'
          - 'pop_kultura'
          - 'povijest'
          - 'sport'
          - 'znanost_i_tehnologija'
      count:
        description: 'Number of questions to audit (0 = full file)'
        required: true
        default: '50'

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Google Gen AI Client
        run: npm install --no-save @google/genai

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Run Question Auditor
        env:
          GOOGLE_GENAI_USE_VERTEXAI: 'true'
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: 'us-central1'
          CATEGORY: ${{ inputs.category }}
          COUNT: ${{ inputs.count }}
        run: node scripts/audit-category.mjs "$CATEGORY" "$COUNT"

      # The audit report stays out of git (/reports/ is gitignored and this
      # repo is public) - it's downloadable from the run instead (audit M4).
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-${{ inputs.category }}-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn

      # Fixes go to a review branch + PR, never straight to main (audit H1).
      # A PR opened with GITHUB_TOKEN does not trigger ci.yml - run CI on the
      # branch via workflow_dispatch before merging.
      - name: Push fixes to a review branch and open a PR
        env:
          CATEGORY: ${{ inputs.category }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="audit/${CATEGORY}-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git add src/data/categories/
          if git diff --cached --quiet; then
            echo "No fixes to commit."
            exit 0
          fi
          git commit -m "fix(data): audit $CATEGORY"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Audit fixes: $CATEGORY" \
            --body "Automated audit run $GITHUB_RUN_ID. The audit report is attached to the run as an artifact (audit-$CATEGORY-$GITHUB_RUN_ID). Review the changes against it and run CI on this branch before merging."
