name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Non-blocking for now: the repo has pre-existing lint errors unrelated
      # to any specific change (unused React imports, a couple of
      # react-hooks rule violations) that predate this workflow. Reported
      # here for visibility without failing every run until those are
      # cleaned up separately.
      - run: npm run lint
        continue-on-error: true
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install driver deps
        working-directory: .claude/skills/run-triviabong
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: .claude/skills/run-triviabong
        run: npx playwright install --with-deps chromium
      - name: Start Firebase emulators
        run: |
          npx firebase emulators:start --only firestore,auth &
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:8080 >/dev/null; do sleep 1; done'
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:9250 >/dev/null; do sleep 1; done'
      - name: Start dev server against the emulator
        env:
          VITE_USE_FIREBASE_EMULATOR: "true"
        run: |
          npm run dev &
          timeout 30 bash -c 'until curl -sf http://localhost:5173 >/dev/null; do sleep 1; done'
      - name: Run golden-path check
        working-directory: .claude/skills/run-triviabong
        run: node golden-path.mjs
      - name: Run cross-device sync check
        working-directory: .claude/skills/run-triviabong
        run: node cross-device-sync-check.mjs
      - name: Run two-player match check
        working-directory: .claude/skills/run-triviabong
        run: node two-player-match-check.mjs
