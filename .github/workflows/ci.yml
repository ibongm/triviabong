name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Non-blocking for now: the repo has pre-existing lint errors unrelated
      # to any specific change (unused React imports, a couple of
      # react-hooks rule violations) that predate this workflow. Reported
      # here for visibility without failing every run until those are
      # cleaned up separately.
      - run: npm run lint
        continue-on-error: true
      - run: npm run build
