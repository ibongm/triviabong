name: Generate Category Questions

on:
  workflow_dispatch:
    inputs:
      category:
        description: 'Choose category'
        required: true
        default: 'geografija'
        type: choice
        options:
          - 'geografija'
          - 'glazba'
          - 'knjizevnost_i_umjetnost'
          - 'opca_znanje'
          - 'pop_kultura'
          - 'povijest'
          - 'sport'
          - 'znanost_i_tehnologija'
      count:
        description: 'How many questions to generate?'
        required: true
        default: '10'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm ci first: the generator now imports src/utils/questionMerge.js,
      # whose import chain needs the project's own dependencies.
      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save @google/genai

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Run Question Generator
        env:
          GOOGLE_GENAI_USE_VERTEXAI: 'true'
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: 'us-central1'
          # Passed via env rather than interpolated into the script, so a
          # free-text input can't inject shell commands.
          INPUT_CATEGORY: ${{ inputs.category }}
          INPUT_COUNT: ${{ inputs.count }}
        run: node scripts/generate-questions.mjs "$INPUT_CATEGORY" "$INPUT_COUNT"

      # Generated questions go to a review branch + PR, never straight to
      # main: every main push auto-deploys, and 2026-10-10..15 shipped ~8.6k
      # unreviewed questions that way (audit H1). Note: a PR opened with
      # GITHUB_TOKEN does not trigger ci.yml - run CI on the branch via
      # "Run workflow" (workflow_dispatch) before merging.
      - name: Push to a review branch and open a PR
        env:
          INPUT_CATEGORY: ${{ inputs.category }}
          INPUT_COUNT: ${{ inputs.count }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="questions/${INPUT_CATEGORY}-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git add src/data/categories/
          # The generator skips duplicates/invalid entries, so a run can
          # legitimately add nothing - don't fail the job on an empty commit.
          if git diff --cached --quiet; then
            echo "No new questions to commit."
            exit 0
          fi
          git commit -m "feat(data): auto-generate questions in $INPUT_CATEGORY (requested $INPUT_COUNT)"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Generated questions: $INPUT_CATEGORY (requested $INPUT_COUNT)" \
            --body "Auto-generated by run $GITHUB_RUN_ID. Needs a Croatian proofreading and fact-check pass before merge. Run CI on this branch (Actions > CI > Run workflow) first."
