name: Generate Category Questions

on:
  workflow_dispatch:
    inputs:
      category:
        description: 'Choose category'
        required: true
        default: 'geografija'
        type: choice
        options:
          - 'geografija'
          - 'glazba'
          - 'knjizevnost_i_umjetnost'
          - 'opca_znanje'
          - 'pop_kultura'
          - 'povijest'
          - 'sport'
          - 'znanost_i_tehnologija'
      count:
        description: 'How many questions to generate?'
        required: true
        default: '10'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Google Gen AI Client
        run: npm install @google/genai

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Run Question Generator
        env:
          GOOGLE_GENAI_USE_VERTEXAI: 'true'
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: 'us-central1'
        run: node scripts/generate-questions.mjs "${{ inputs.category }}" "${{ inputs.count }}"

      - name: Create Pull Request with New Questions
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(data): auto-generate ${{ inputs.count }} questions in${{ inputs.category }}"
          title: "Quiz Generator: +${{ inputs.count }} questions in${{ inputs.category }}"
          body: |
            Automatically generated via Vertex AI Gemini 2.5 Flash.
            Category: `${{ inputs.category }}`
            Please review the diff before merging into main.
          branch: "ai-questions-${{ inputs.category }}"
          delete-branch: true
